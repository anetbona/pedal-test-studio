<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Statystyki — PedalTest Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Minimalny wgląd dla admina (A3) — szata Knobyfier */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --green: #2e7d32; --ink: #111111; --gray: #6b7280; --border: #e5e5e5;
      --heading: 'Oswald', 'Arial Narrow', sans-serif;
      --body: 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    }
    body {
      font-family: var(--body); background: #ffffff; color: var(--ink);
      font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased;
    }
    .topbar {
      height: 64px; display: flex; align-items: center; padding: 0 32px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      font-family: var(--heading); font-size: 21px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; color: var(--ink); text-decoration: none;
    }
    .topbar a.cta {
      margin-left: auto; color: var(--green); border: 2px solid var(--green); border-radius: 3px;
      padding: 8px 22px; font-family: var(--heading); font-size: 13px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase; text-decoration: none;
    }
    .topbar a.cta:hover { background: var(--green); color: #fff; }
    main { max-width: 820px; margin: 0 auto; padding: 48px 24px 64px; }
    .eyebrow {
      font-family: var(--heading); font-size: 13px; font-weight: 600;
      letter-spacing: 4px; text-transform: uppercase; color: var(--green); margin-bottom: 10px;
    }
    h1 {
      font-family: var(--heading); font-size: 40px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;
    }
    .sub { color: var(--gray); margin-bottom: 36px; }
    .sub a { color: var(--green); font-weight: 600; }
    .totals { display: flex; gap: 14px; margin-bottom: 40px; flex-wrap: wrap; }
    .total-card {
      flex: 1; min-width: 200px; background: #fff; border: 1px solid var(--border);
      border-radius: 4px; padding: 20px 26px;
    }
    .total-card .num { font-family: var(--heading); font-size: 38px; font-weight: 700; color: var(--green); line-height: 1.1; }
    .total-card .lbl {
      font-family: var(--heading); font-size: 12px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase; color: var(--gray);
    }
    section { margin-bottom: 34px; }
    .sec-head { display: flex; align-items: baseline; gap: 12px; border-top: 1px solid var(--border); padding-top: 18px; margin-bottom: 12px; }
    .sec-num { font-family: var(--heading); font-size: 13px; font-weight: 600; letter-spacing: 2px; color: var(--green); }
    h2 { font-family: var(--heading); font-size: 20px; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
    th, td { text-align: left; padding: 10px 16px; border-bottom: 1px solid var(--border); }
    th {
      font-family: var(--heading); font-size: 11px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase; color: var(--gray); background: #fafafa;
    }
    tr:last-child td { border-bottom: none; }
    td.num { text-align: right; font-weight: 700; color: var(--green); }
    .empty { color: var(--gray); padding: 14px 16px; border: 1px dashed var(--border); border-radius: 4px; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/">PedalTest Studio</a>
    <a class="cta" href="/">Katalog</a>
  </div>
  <main>
    <div class="eyebrow">Panel admina</div>
    <h1>Statystyki</h1>
    <p class="sub">Anonimowe zdarzenia per kostka / nagranie / sklep — zero danych osobowych. Surowe dane: <a href="/api/stats">/api/stats</a></p>
    <div class="totals">
      <div class="total-card"><div class="num" id="t-plays">–</div><div class="lbl">odtworzenia</div></div>
      <div class="total-card"><div class="num" id="t-clicks">–</div><div class="lbl">kliknięcia w bannery</div></div>
    </div>
    <section><div class="sec-head"><span class="sec-num">01</span><h2>Odtworzenia per kostka</h2></div><div id="plays-pedal"></div></section>
    <section><div class="sec-head"><span class="sec-num">02</span><h2>Odtworzenia per nagranie</h2></div><div id="plays-recording"></div></section>
    <section><div class="sec-head"><span class="sec-num">03</span><h2>Kliknięcia per kostka</h2></div><div id="clicks-pedal"></div></section>
    <section><div class="sec-head"><span class="sec-num">04</span><h2>Kliknięcia per sklep</h2></div><div id="clicks-store"></div></section>
  </main>
  <script>
    function table(containerId, obj, keyHeader) {
      const el = document.getElementById(containerId);
      const entries = Object.entries(obj).sort((a, b) => b[1] - a[1]);
      if (!entries.length) { el.innerHTML = '<div class="empty">Brak zdarzeń.</div>'; return; }
      const rows = entries.map(([k, v]) =>
        `<tr><td>${k.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</td><td class="num">${v}</td></tr>`).join('');
      el.innerHTML = `<table><thead><tr><th>${keyHeader}</th><th style="text-align:right">liczba</th></tr></thead><tbody>${rows}</tbody></table>`;
    }
    fetch('/api/stats').then(r => r.json()).then(s => {
      document.getElementById('t-plays').textContent = s.totals.plays;
      document.getElementById('t-clicks').textContent = s.totals.affiliateClicks;
      table('plays-pedal', s.playsPerPedal, 'kostka');
      table('plays-recording', s.playsPerRecording, 'nagranie');
      table('clicks-pedal', s.clicksPerPedal, 'kostka');
      table('clicks-store', s.clicksPerStore, 'sklep');
    });
  </script>
</body>
</html>
